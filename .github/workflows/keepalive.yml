name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ vars.SHADOW_SLAVE_API_URL || 'https://shadow-slave-api.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 60 "$API_URL/health"
